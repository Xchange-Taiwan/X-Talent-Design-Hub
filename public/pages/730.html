    if(state.phase==='attendance')return `<div class="xt730-fade"><p class="xt730-step-label">步驟 1 / 2 · 確認會談</p><h3 id="xt730-desktop-modal-title">這場會談是否順利進行？</h3><p class="xt730-support">先告訴我們這次會談的狀況。</p><fieldset class="xt730-choices" aria-labelledby="xt730-desktop-modal-title" style="border:0;padding:0"><label class="xt730-choice cursor-interaction"><input type="radio" name="xt730-desktop-attendance" value="yes" ${state.answer==='yes'?'checked':''}>有進行</label><label class="xt730-choice cursor-interaction"><input type="radio" name="xt730-desktop-attendance" value="no" ${state.answer==='no'?'checked':''}>沒有進行</label></fieldset><div class="xt730-form-actions" style="justify-content:flex-end">${btn('next',`下一步${icon('arrow-right')}`,true,state.answer?'':'disabled')}</div></div>`;
    const bottom=`<div class="xt730-form-actions"><button type="button" class="xt730-text-button cursor-interaction" data-action="back" ${state.busy?'disabled':''}>上一步</button>${btn('submit',state.busy?'<span class="xt730-spinner" aria-hidden="true"></span>送出中…':'送出回饋',true,`${state.busy?'disabled aria-busy="true"':''} ${state.phase==='reason'&&!state.reason?'disabled':''}`)}</div>`;
    if(state.phase==='rating')return `<form class="xt730-fade" data-feedback-form><p class="xt730-step-label">步驟 2 / 2 · 交流回饋</p><div class="xt730-rating-heading"><h3 id="xt730-desktop-modal-title">為本次會議評分</h3><span class="xt730-privacy-anchor"><button type="button" class="xt730-privacy-trigger cursor-interaction" data-privacy-trigger aria-label="姓名遮罩說明" aria-describedby="xt730-desktop-privacy-tooltip" aria-expanded="false">${privacyIcon}</button><span id="xt730-desktop-privacy-tooltip" class="xt730-privacy-tooltip" role="tooltip" hidden>${privacyText}</span></span></div><div class="xt730-rating-value"><span id="xt730-desktop-rating-label">評分</span><output class="xt730-score" aria-live="polite" aria-atomic="true">${state.rating}</output></div><div class="xt730-stars" role="radiogroup" aria-labelledby="xt730-desktop-rating-label" aria-label="評分，1 至 10 分">${Array.from({length:10},(_,i)=>{const value=i+1;return `<button type="button" class="xt730-star cursor-interaction ${value<=state.rating?'is-filled':''}" role="radio" aria-checked="${value===state.rating}" aria-label="${value} 分" data-rating="${value}" tabindex="${value===state.rating?0:-1}" ${state.busy?'disabled':''}>${icon('star')}</button>`;}).join('')}</div><label class="xt730-field-label" for="xt730-desktop-comment">文字回饋<span>（選填）</span></label><textarea id="xt730-desktop-comment" class="xt730-textarea" rows="5" placeholder="分享這次交流的收穫，或給導師一些建議…" ${state.busy?'disabled':''}>${esc(state.comment)}</textarea><span class="xt730-counter">${Array.from(state.comment).length} / 1000</span>${bottom}</form>`;
    return `<form class="xt730-fade" data-feedback-form><p class="xt730-step-label">步驟 2 / 2 · 會談狀況</p><h3 id="xt730-desktop-modal-title">未進行會談的原因</h3><p class="xt730-field-label" id="xt730-desktop-reason-title" style="margin-top:16px">為何沒有成功進行？</p><fieldset class="xt730-reasons" aria-labelledby="xt730-desktop-reason-title" style="padding:0;border:0">${reasons.map((r,i)=>`<label class="xt730-reason cursor-interaction"><input type="radio" name="xt730-desktop-reason" value="${i}" ${state.reason===r?'checked':''} ${state.busy?'disabled':''}>${r}</label>`).join('')}</fieldset><div class="xt730-other" ${state.reason==='其他'?'':'hidden'}><label class="xt730-field-label" for="xt730-desktop-other">補充說明<span>（選填）</span></label><textarea class="xt730-textarea" rows="3" id="xt730-desktop-other" placeholder="說說發生了什麼事…" ${state.busy?'disabled':''}>${esc(state.other)}</textarea></div>${bottom}</form>`;
  }
  function detail(s){
    if(s.status==='reviewed')return `<div class="xt730-detail-label"><strong>我的回饋</strong><span class="xt730-detail-score">${s.rating} / 10</span></div><p>${s.comment?esc(s.comment):'沒有留下文字回饋。'}</p>`;
    if(s.status==='no-show')return `<div class="xt730-detail-label"><strong>會談紀錄</strong></div><p>${esc(s.reason)}${s.other?` · ${esc(s.other)}`:''}</p>`;
    return `<dl><dt>交流主題</dt><dd>${esc(s.topic)}</dd><dt>會談時間</dt><dd>${s.date} ${s.time}</dd>${s.status==='cancelled'?'<dt>預約狀態</dt><dd>Cancelled</dd>':''}</dl>`;
  }
  function history(){return `<section class="xt730-history" aria-label="所有歷史紀錄">
    <div class="xt730-history-list">${state.entries.map(s=>{
      const p=people[s.person],active=s.id===state.selected&&s.status==='pending'&&state.phase!=='closed';
      const open=state.expanded===s.id;
      let action='';
      if(active)action='';
      else if(s.status==='pending')action=`<button type="button" class="xt730-button xt730-primary cursor-interaction" data-fill="${s.id}" ${state.busy?'disabled':''}>填寫回饋</button>`;
      else if(s.status==='reviewed')action=`<button type="button" class="xt730-text-button cursor-interaction" data-expand="${s.id}" aria-expanded="${open}" ${state.busy?'disabled':''}>查看回饋${icon(open?'chevron-up':'chevron-down')}</button>`;
      else action=`<span class="xt730-badge">${s.status==='cancelled'?'Cancelled':'未進行'}</span><button type="button" class="xt730-icon-button cursor-interaction" data-expand="${s.id}" aria-label="${open?'收合':'展開'} ${p.name} ${s.date} 的會談詳情" aria-expanded="${open}" ${state.busy?'disabled':''}>${icon(open?'chevron-up':'chevron-down')}</button>`;
      return `<article class="xt730-history-item ${active?'is-writing':open?'is-selected':''}" data-history-id="${s.id}">
        <div class="xt730-history-row"><img src="${p.photo}" alt=""><div class="xt730-history-identity"><strong>${p.name}</strong><p class="xt730-person-role">${p.role}</p></div><div class="xt730-history-actions">${action}</div></div>
        <div class="xt730-session-meta"><span>${icon('calendar-days')}${s.date}</span><span>${icon('clock-3')}${s.time}</span></div>
        <div style="margin-top:16px"><a class="xt730-button xt730-outline" style="display:inline-flex;align-items:center;gap:8px;text-decoration:none" href="https://xtalent-chat-654.bonny80.chatgpt.site/preview.html?scene=new&partner=${encodeURIComponent(p.name)}" target="_blank" rel="noreferrer">${icon('message-square')}聯絡導師</a></div>
        ${open?`<div class="xt730-detail xt730-fade">${detail(s)}</div>`:''}
      </article>`;
    }).join('')}</div></section>`;}
  function otherTab(){const upcoming=state.tab==='upcoming';return `<section class="xt730-other-tab"><div class="xt730-context"><img src="${assets.sarah}" alt=""><div><strong>Sarah Lin</strong><p>2026/10/${upcoming?'26':'29'} · 19:00–19:30</p></div><span class="xt730-badge" style="margin-left:auto">${upcoming?'即將到來':'待確認'}</span></div><h3>產品經理的職涯探索</h3><p>${upcoming?'會議連結已寄送至你的信箱。':'等待導師確認這次預約。'}</p></section>`;}
  function render(){header();$('.xt730-main').innerHTML=`<div class="xt730-heading"><h1>我的預約</h1></div><div class="xt730-tabs" role="tablist" aria-label="預約類型">${[['pending','待確認',1],['upcoming','即將到來',1],['history','歷史紀錄',6]].map(([id,label,count])=>`<button type="button" role="tab" class="xt730-tab cursor-interaction" data-tab="${id}" aria-selected="${state.tab===id}" aria-controls="xt730-desktop-panel" ${state.busy?'disabled':''}>${label}<span class="xt730-count">${count}</span></button>`).join('')}</div><div id="xt730-desktop-panel" role="tabpanel" aria-label="${state.tab==='history'?'歷史紀錄':state.tab==='upcoming'?'即將到來':'待確認'}">${state.tab==='history'?history():otherTab()}</div>`;modal();icons();}
  function modal(){
    const open=state.phase!=='closed',layer=$('.xt730-modal-layer'),page=$('.xt730-page'),box=$('.xt730-toast');
    layer.hidden=!open;page.inert=open;
    if(open)page.setAttribute('aria-hidden','true');else page.removeAttribute('aria-hidden');
    $('.xt730-window').classList.toggle('has-modal',open);
    if(open){
      const s=current(),p=people[s.person],panel=$('.xt730-dialog');
      panel.innerHTML=`<button type="button" class="xt730-icon-button xt730-dialog-close cursor-interaction" data-action="exit" aria-label="關閉回饋視窗" ${state.busy?'disabled':''}>${icon('x')}</button><div class="xt730-dialog-context"><img src="${p.photo}" alt=""><div><strong>${p.name}</strong><p>${s.date} · ${s.time}</p></div></div><div class="xt730-stage" data-stage>${stage()}</div>`;
      layer.append(box);
    }else{ $('.xt730-window').append(box);$('.xt730-dialog').innerHTML=''; }
  }
  function closeModal(){
    if(state.busy||state.phase==='closed')return;
    rememberDraft();resetDraft();state.phase='closed';render();$(`[data-fill="${state.selected}"]`)?.focus({preventScroll:true});persist();
  }
  function updateStage(){const target=$('[data-stage]');if(target){target.innerHTML=stage();$('.xt730-dialog').scrollTop=0;icons();}}
  function focusForm(){const token=++focusToken;requestAnimationFrame(()=>{if(token!==focusToken)return;const el=$('[data-rating][aria-checked=true]:not(:disabled)')||$('[data-stage] input:not(:disabled),[data-stage] textarea:not(:disabled)')||$('[data-stage] button:not(:disabled)');el?.focus({preventScroll:true});});}
  function resetDraft(){state.answer=null;state.rating=10;state.comment='';state.reason='';state.actor='';state.other='';state.failed=false;clearTimeout(toastTimer);$('.xt730-toast').hidden=true;}
  function rememberDraft(){if(current().status==='pending'&&state.phase!=='closed')drafts[state.selected]={answer:state.answer,rating:state.rating,comment:state.comment,reason:state.reason,actor:state.actor,other:state.other,phase:state.phase};}
  function choose(id,start=false){const s=entry(id);if(!s||state.busy||s.status!=='pending')return;rememberDraft();resetDraft();state.selected=id;state.tab='history';state.expanded=null;Object.assign(state,drafts[id]||{}, {phase:'attendance',pop:null});render();persist();focusForm();}
  function toast(message,error=false){
    clearTimeout(toastTimer);const box=$('.xt730-toast');
    box.innerHTML=`<div class="xt730-toast-copy"><strong class="xt730-toast-title">${error?'送出失敗':'回饋已送出'}</strong><p class="xt730-toast-body">${error?'內容已保留，請再試一次。':esc(message)}</p></div><button type="button" class="xt730-icon-button cursor-interaction" data-action="dismiss-toast" aria-label="關閉提示">${icon('x')}</button>`;
    box.hidden=false;box.classList.toggle('is-error',error);box.setAttribute('role',error?'alert':'status');
    icons();if(!error)toastTimer=setTimeout(()=>box.hidden=true,5000);
  }
  function submit(){
    if(state.busy||current().status!=='pending'||!['rating','reason'].includes(state.phase))return;
    if(state.phase==='reason'&&(!state.reason||!state.actor))return;
    if(Array.from(state.comment).length>1000)return;
    state.busy=true;state.failed=false;render();announce('正在送出回饋');
    const id=state.selected,answer=state.answer;
    timer=setTimeout(()=>{
      state.busy=false;
      if(settings.delivery==='失敗一次後重試'&&!state.failConsumed){state.failConsumed=true;state.failed=true;render();toast('送出失敗，內容已保留。',true);focusForm();return;}
      const s=entry(id);
      if(answer==='no')Object.assign(s,{status:'no-show',attendance:'no',outcome:'no',actor:state.actor,reason:state.reason,other:state.reason==='其他'?state.other:''});
      else Object.assign(s,{status:'reviewed',attendance:'yes',outcome:s.mentor==='no'?'no':'yes',rating:state.rating,comment:state.comment});
      delete drafts[id];state.phase='closed';state.expanded=null;render();$(`[data-history-id="${id}"]`)?.scrollIntoView({block:'nearest',behavior:'smooth'});toast(answer==='no'?'X-Talent 已收到您的回饋，謝謝您！':'回饋已送出，謝謝你的分享。');announce(answer==='no'?'會談已標記為未進行':'你的回饋已送出');$(`[data-expand="${id}"]`)?.focus({preventScroll:true});persist();
    },850);
  }
  root.addEventListener('submit',e=>{e.preventDefault();submit();});
  root.addEventListener('input',e=>{
    if(e.target.id==='xt730-desktop-comment'){const value=Array.from(e.target.value).slice(0,1000).join('');if(value!==e.target.value)e.target.value=value;state.comment=value;$('.xt730-counter').textContent=`${Array.from(value).length} / 1000`;}
    if(e.target.id==='xt730-desktop-other')state.other=e.target.value;
  });
  root.addEventListener('change',e=>{
    if(e.target.name==='xt730-desktop-attendance'){state.answer=e.target.value;$('[data-action=next]').disabled=false;persist();}
    if(e.target.name==='xt730-desktop-reason'){state.reason=reasons[Number(e.target.value)];$('.xt730-other').hidden=state.reason!=='其他';$('[data-action=submit]').disabled=!state.reason;}
    if(e.target.name==='xt730-desktop-actor'){state.actor=e.target.value;$('[data-action=submit]').disabled=!state.reason;}
    if(e.target.id==='xt730-desktop-session')choose(e.target.value);
  });
  function paintRating(preview=state.rating){
    root.querySelectorAll('[data-rating]').forEach(button=>{
      const value=Number(button.dataset.rating),selected=value===state.rating;
      button.classList.toggle('is-filled',value<=preview);
      button.setAttribute('aria-checked',String(selected));
      button.tabIndex=selected?0:-1;
    });
    const score=$('.xt730-score');if(score)score.textContent=state.rating;
  }
  function selectRating(value,focus=false){
    if(state.busy||state.phase!=='rating'||!Number.isInteger(value)||value<1||value>10)return;
    state.rating=value;paintRating();rememberDraft();persist();
    if(focus)$(`[data-rating="${value}"]`)?.focus({preventScroll:true});
  }
  function showPrivacyTooltip(open,pinned){
    const trigger=$('[data-privacy-trigger]'),tooltip=$('.xt730-privacy-tooltip');
    if(!trigger||!tooltip)return;
    tooltip.hidden=!open;trigger.setAttribute('aria-expanded',String(open));
    if(pinned!==undefined)trigger.dataset.pinned=String(pinned);
  }
  root.addEventListener('pointerover',e=>{
    const star=e.target.closest('[data-rating]');if(e.pointerType!=='touch'&&star&&!state.busy)paintRating(Number(star.dataset.rating));
    if(e.pointerType!=='touch'&&e.target.closest('[data-privacy-trigger]'))showPrivacyTooltip(true);
  });
  root.addEventListener('pointerout',e=>{
    const stars=e.target.closest('.xt730-stars');if(stars&&!stars.contains(e.relatedTarget))paintRating();
    const heading=e.target.closest('.xt730-rating-heading'),trigger=$('[data-privacy-trigger]');
    if(heading&&!heading.contains(e.relatedTarget)&&trigger?.dataset.pinned!=='true'&&document.activeElement!==trigger)showPrivacyTooltip(false);
  });
  root.addEventListener('focusin',e=>{if(e.target.matches('[data-privacy-trigger]'))showPrivacyTooltip(true);});
  root.addEventListener('focusout',e=>{if(e.target.matches('[data-privacy-trigger]'))showPrivacyTooltip(false,false);});
  root.addEventListener('click',e=>{
    if(!e.target.closest('[data-privacy-trigger],.xt730-privacy-tooltip'))showPrivacyTooltip(false,false);
    const target=e.target.closest('button');if(!target||target.disabled)return;
    if(target.dataset.rating){selectRating(Number(target.dataset.rating));return;}
    if(target.hasAttribute('data-privacy-trigger')){const open=target.dataset.pinned!=='true';showPrivacyTooltip(open,open);return;}
    if(target.dataset.session){choose(target.dataset.session);return;}
    if(target.dataset.fill){choose(target.dataset.fill,true);return;}
    if(target.dataset.expand){const id=target.dataset.expand;if(state.busy)return;rememberDraft();resetDraft();state.phase='closed';state.expanded=state.expanded===id?null:id;render();$(`[data-expand="${id}"]`)?.focus({preventScroll:true});persist();return;}
    if(target.dataset.tab){if(state.busy)return;rememberDraft();state.tab=target.dataset.tab;resetDraft();state.phase='closed';render();$(`[data-tab="${state.tab}"]`)?.focus({preventScroll:true});persist();return;}
    const action=target.dataset.action;
    if(action==='next'&&state.answer){state.phase=state.answer==='yes'?'rating':'reason';state.failed=false;updateStage();persist();focusForm();}
    if(action==='back'&&!state.busy){state.phase='attendance';state.failed=false;updateStage();focusForm();persist();}
    if(action==='exit')closeModal();
    if(action==='submit')submit();
    if(action==='dismiss-toast'){$('.xt730-toast').hidden=true;if(state.phase!=='closed')focusForm();}
    if(action==='menu'||action==='notifications'){state.pop=state.pop===action?null:action;header();icons();}
  });
  root.addEventListener('keydown',e=>{
    if(state.phase==='closed')return;
    const star=e.target.closest('[data-rating]');
    if(star&&!state.busy&&['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Home','End'].includes(e.key)){
      e.preventDefault();const value=Number(star.dataset.rating);
      selectRating(e.key==='Home'?1:e.key==='End'?10:((value-1+(['ArrowRight','ArrowDown'].includes(e.key)?1:9))%10)+1,true);return;
    }
    if(e.key==='Escape'){e.preventDefault();if(!$('.xt730-toast').hidden){$('.xt730-toast').hidden=true;focusForm();return;}const tooltip=$('.xt730-privacy-tooltip');if(tooltip&&!tooltip.hidden){showPrivacyTooltip(false,false);return;}closeModal();return;}
    if(e.key==='Tab'){
      const controls=[...$('.xt730-modal-layer').querySelectorAll('button:not(:disabled),input:not(:disabled),textarea:not(:disabled),a[href]')].filter(el=>el.getClientRects().length&&el.tabIndex>=0);
      const first=controls[0],last=controls.at(-1);
      if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus();}
      else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus();}
    }
  });
  $('.xt730-modal-layer').addEventListener('click',e=>{if(e.target===$('.xt730-modal-layer'))closeModal();});
  render();
  if(globalThis.Tweak){
    const tweak=new Tweak({container:root,onChange:()=>{state.failConsumed=false;state.failed=false;}});
    tweak.addSelect(settings,'delivery',{label:'送出情境',options:['正常送出','失敗一次後重試']});
  }
})();
