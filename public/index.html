<html lang="zh-Hant">
<head><meta name="darkreader-lock"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Xchange｜Design Hub</title><meta name="description" content="Xchange 設計管理平台。畫面、元件與 Ticket。"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap"><link rel="stylesheet" href="hub.css?v=d378acb8ce2f"><link rel="stylesheet" href="ios-shell.css?v=8e64e423ba91"></head>

<header class="app-header">

 <nav class="main-nav" aria-label="平台入口" role="tablist"><button data-view="screens" role="tab" aria-selected="true" aria-controls="screens-view" aria-current="page"><i data-lucide="layout-grid" aria-hidden="true"></i><span>畫面</span></button><button data-view="library" role="tab" aria-selected="false" aria-controls="screens-view"><i data-lucide="layers" aria-hidden="true"></i><span>元件庫</span></button></nav>

</header>
<div class="workspace">
 <aside class="sidebar" aria-label="畫面目錄"><div class="sidebar-top" hidden><span id="directory-label"></span><span id="screen-count"></span></div><nav id="screen-list"></nav></aside>
 <main class="main">
  <section class="context" aria-label="畫面管理列">
   <div class="context-top"><div class="page-heading"><span class="eyebrow" id="page-group" hidden></span><h1 id="page-title"></h1></div><div class="device-control" role="group" aria-label="預覽裝置"><button data-device="desktop" aria-pressed="true">Desktop</button><button data-device="tablet" aria-pressed="false">Tablet</button><button data-device="mobile" aria-pressed="false">Mobile</button></div><div class="mode-control" role="group" aria-label="互動模式"><button data-mode="play" aria-pressed="true">操作模式</button><button data-mode="inspect" aria-pressed="false">檢視模式</button></div><button id="reset" class="icon-button" aria-label="重設目前畫面" title="重設目前畫面"><i data-lucide="rotate-ccw" aria-hidden="true"></i></button><button id="share" class="icon-button" aria-label="複製目前檢視連結" title="複製目前檢視連結"><i data-lucide="share-2" aria-hidden="true"></i></button></div>
   <div class="context-bottom"><div class="related"><span>相關 Ticket</span><div id="related-tags"></div></div><div class="scenario-field"><label for="scenario">情境</label><select id="scenario" aria-label="切換情境"></select></div></div>
  </section>
  <section id="screens-view" class="screens-view" role="tabpanel"><div class="canvas-meta" hidden><span id="source-caption"></span><span id="canvas-hint"></span></div><div class="canvas" id="canvas"><div id="frame-wrap"><iframe id="product" title="X-Talent 交付畫面" sandbox="allow-scripts allow-same-origin allow-forms allow-downloads allow-popups allow-popups-to-escape-sandbox"></iframe></div><div id="loading" role="status">載入中…</div></div></section>
  <section id="library-view" class="library-view" role="tabpanel" hidden><div class="library-intro"><div class="library-links"><a id="storybook" target="_blank" rel="noopener">Storybook ↗</a></div></div><div class="library-toolbar"><label><span class="sr-only">搜尋元件</span><input id="component-search" type="search" placeholder="搜尋元件"></label><span id="library-count"></span></div><div class="component-grid" id="component-grid"></div></section>
 </main>
</div>
<aside id="inspector" class="inspector" aria-label="元件與修改紀錄" hidden><div class="inspector-title"><span>檢視畫面</span><button id="close-inspector" class="icon-button" aria-label="關閉檢視面板">×</button></div><div id="inspector-body"></div></aside>
<div id="notice" class="notice" role="status" hidden></div>
