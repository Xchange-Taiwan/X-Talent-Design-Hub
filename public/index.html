<!doctype html>
<html lang="zh-Hant">
<head><meta name="darkreader-lock" />
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>X-Talent Design Hub · 定案畫面與即時 Storybook 元件庫</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", sans-serif; background: #f3f4f6; color: #18181b; font-size: 13px; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    .topbar { height: 56px; background: #fff; border-bottom: 1px solid #e4e4e7; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; flex-shrink: 0; }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 15px; color: #18181b; }
    .brand-pill { background: #6d28d9; color: #fff; font-size: 11px; padding: 2px 8px; border-radius: 999px; font-weight: 600; }
    .tabs { display: flex; gap: 6px; height: 100%; align-items: center; }
    .tab-btn { border: 0; background: transparent; padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: 600; color: #52525b; font-size: 13px; }
    .tab-btn.active { background: #ede9fe; color: #5b21b6; }
    .links { display: flex; align-items: center; gap: 10px; }
    .ext-link { text-decoration: none; padding: 6px 12px; border-radius: 8px; border: 1px solid #e4e4e7; color: #3f3f46; font-weight: 500; background: #fafafa; }
    .ext-link:hover { background: #f4f4f5; }
    .workspace { flex: 1; display: flex; overflow: hidden; }
    .sidebar { width: 280px; background: #fff; border-right: 1px solid #e4e4e7; display: flex; flex-direction: column; overflow-y: auto; padding: 14px; gap: 8px; flex-shrink: 0; }
    .side-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: #71717a; margin: 6px 4px; }
    .item-card { border: 1px solid #e4e4e7; border-radius: 10px; padding: 10px 12px; cursor: pointer; background: #fff; text-align: left; transition: all 0.15s; }
    .item-card:hover { border-color: #a78bfa; }
    .item-card.active { border-color: #6d28d9; background: #f5f3ff; }
    .item-head { display: flex; align-items: center; justify-content: space-between; gap: 6px; font-weight: 600; color: #18181b; margin-bottom: 4px; }
    .ticket-tag { font-size: 11px; padding: 1px 6px; border-radius: 6px; background: #ede9fe; color: #5b21b6; font-weight: 600; }
    .item-meta { font-size: 11px; color: #71717a; line-height: 1.4; }
    .stage { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: #eef0f4; }
    .stage-bar { height: 44px; background: #fff; border-bottom: 1px solid #e4e4e7; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; }
    .vp-group { display: flex; gap: 4px; }
    .vp-btn { border: 1px solid #e4e4e7; background: #fff; padding: 4px 10px; border-radius: 6px; cursor: pointer; font-size: 12px; }
    .vp-btn.active { background: #18181b; color: #fff; border-color: #18181b; }
    .frame-wrap { flex: 1; display: flex; justify-content: center; align-items: stretch; padding: 16px; overflow: auto; }
    iframe { border: 1px solid #d4d4d8; border-radius: 12px; background: #fff; width: 100%; height: 100%; box-shadow: 0 4px 16px rgba(0,0,0,0.05); transition: width 0.2s; }
    .changelog-box { max-width: 820px; margin: 24px auto; background: #fff; border-radius: 14px; border: 1px solid #e4e4e7; padding: 24px; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span>X-Talent Design Hub</span>
      <span class="brand-pill">Cloudflare Auto-Deploy</span>
    </div>
    <nav class="tabs">
      <button class="tab-btn active" onclick="switchTab('screens')" id="tab-screens">定案與探索畫面 (Screens)</button>
      <button class="tab-btn" onclick="switchTab('library')" id="tab-library">即時 Storybook 元件庫 (Live Sync)</button>
      <button class="tab-btn" onclick="switchTab('changelog')" id="tab-changelog">協作規範與修改紀錄</button>
    </nav>
    <div class="links">
      <a class="ext-link" href="https://x-talent-storybook.x-talent.workers.dev" target="_blank" rel="noopener">開啟完整 Storybook ↗</a>
      <a class="ext-link" href="https://www.figma.com/design/caZJl0JBnxn0KZunPev0fX/" target="_blank" rel="noopener">全站 Figma (#826) ↗</a>
      <a class="ext-link" href="https://xtalentdev.vercel.app" target="_blank" rel="noopener">測試站 (xtalentdev) ↗</a>
    </div>
  </header>

  <main class="workspace" id="view-main">
    <aside class="sidebar" id="sidebar-list"></aside>
    <section class="stage">
      <div class="stage-bar">
        <div id="stage-info" style="font-weight:600;color:#27272a">載入中...</div>
        <div class="vp-group">
          <button class="vp-btn active" onclick="setViewport('100%', this)">Desktop (100%)</button>
          <button class="vp-btn" onclick="setViewport('768px', this)">Tablet (768px)</button>
          <button class="vp-btn" onclick="setViewport('390px', this)">Mobile (390px)</button>
        </div>
      </div>
      <div class="frame-wrap" id="frame-container">
        <iframe id="preview-frame" src="./screens/chat-654.html"></iframe>
      </div>
    </section>
  </main>

  <script>
    const STORYBOOK_BASE = 'https://x-talent-storybook.x-talent.workers.dev';
    let manifest = { screens: [], changelog: [] };
    let storybookEntries = [];
    let currentTab = 'screens';

    async function init() {
      try {
        const res = await fetch('./hub-manifest.json?t=' + Date.now());
        manifest = await res.json();
      } catch (e) {
        console.warn('Manifest load error:', e);
      }
      renderScreensTab();
    }

    function setViewport(width, btn) {
      document.querySelectorAll('.vp-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const frame = document.getElementById('preview-frame');
      if (frame) frame.style.width = width;
    }

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('tab-' + tab).classList.add('active');
      if (tab === 'screens') renderScreensTab();
      else if (tab === 'library') renderLibraryTab();
      else renderChangelogTab();
    }

    function renderScreensTab() {
      const side = document.getElementById('sidebar-list');
      side.style.display = 'flex';
      const container = document.getElementById('frame-container');
      container.innerHTML = '<iframe id="preview-frame" src=""></iframe>';
      side.innerHTML = '<div class="side-title">設計畫面清單 (' + manifest.screens.length + ')</div>';
      manifest.screens.forEach((sc, idx) => {
        const card = document.createElement('div');
        card.className = 'item-card' + (idx === 0 ? ' active' : '');
        card.innerHTML = '<div class="item-head"><span>' + sc.title + '</span><span class="ticket-tag">' + sc.ticket + '</span></div>' +
          '<div class="item-meta">' + sc.status + ' · 更新於 ' + sc.updatedAt + '<br/>' + (sc.notes || '') + '</div>';
        card.onclick = () => {
          side.querySelectorAll('.item-card').forEach(c => c.classList.remove('active'));
          card.classList.add('active');
          document.getElementById('preview-frame').src = sc.path;
          document.getElementById('stage-info').textContent = sc.title + ' (' + sc.ticket + ' · ' + sc.status + ')';
        };
        side.appendChild(card);
      });
      if (manifest.screens[0]) {
        document.getElementById('preview-frame').src = manifest.screens[0].path;
        document.getElementById('stage-info').textContent = manifest.screens[0].title + ' (' + manifest.screens[0].ticket + ')';
      }
    }

    async function renderLibraryTab() {
      const side = document.getElementById('sidebar-list');
      side.style.display = 'flex';
      side.innerHTML = '<div class="side-title">正在從線上 Storybook 同步最新元件...</div>';
      const container = document.getElementById('frame-container');
      container.innerHTML = '<iframe id="preview-frame" src="' + STORYBOOK_BASE + '"></iframe>';
      document.getElementById('stage-info').textContent = '即時 Storybook 元件庫 (' + STORYBOOK_BASE + ')';

      try {
        const res = await fetch(STORYBOOK_BASE + '/index.json');
        const data = await res.json();
        const entries = Object.values(data.entries || {}).filter(e => e.type === 'story');
        side.innerHTML = '<div class="side-title">線上真實 Storybook 元件 (' + entries.length + ')</div>';
        entries.forEach((ent, idx) => {
          const card = document.createElement('div');
          card.className = 'item-card' + (idx === 0 ? ' active' : '');
          card.innerHTML = '<div class="item-head"><span>' + ent.title + '</span><span class="ticket-tag">' + ent.name + '</span></div>' +
            '<div class="item-meta">' + (ent.importPath || '') + '</div>';
          card.onclick = () => {
            side.querySelectorAll('.item-card').forEach(c => c.classList.remove('active'));
            card.classList.add('active');
            document.getElementById('preview-frame').src = STORYBOOK_BASE + '/iframe.html?id=' + encodeURIComponent(ent.id) + '&viewMode=story';
            document.getElementById('stage-info').textContent = ent.title + ' / ' + ent.name + ' (來自 X-Talent-Frontend develop 最新建置)';
          };
          side.appendChild(card);
        });
      } catch (err) {
        side.innerHTML = '<div class="side-title">Storybook 元件庫</div><div class="item-card active"><div class="item-head">直接瀏覽完整 Storybook</div><div class="item-meta">右側已載入線上最新 Storybook 實例，任何前端元件更新皆自動同步。</div></div>';
      }
    }

    function renderChangelogTab() {
      const side = document.getElementById('sidebar-list');
      side.style.display = 'none';
      document.getElementById('stage-info').textContent = 'Design Hub x Storybook x Figma 協作規範與發佈流程';
      const container = document.getElementById('frame-container');
      container.innerHTML = `
        <div class="changelog-box">
          <h2 style="margin-top:0">X-Talent Design Hub 自動化協作工作流</h2>
          <p style="color:#52525b;line-height:1.6">本中心取代個人私有的 <code>*.chatgpt.site</code> 連結，供 PM 撰寫 PRD、設計師更新定案畫面、以及前端工程師對齊元件規格使用。</p>
          <h3>1. 兩階段發佈路線（Preview 預覽 -> Production 正式覆蓋）</h3>
          <ul style="line-height:1.8;color:#3f3f46">
            <li><strong>Step 1（預覽確認）</strong>：Bonny 在本地使用 ChatGPT Codex 或 Aside 執行 <code>node scripts/publish-design-hub.mjs --mode preview --ticket 737</code>，自動推至 <code>preview/*</code> 分支並發佈至預覽站 <a href="https://x-talent-design-hub-preview.x-talent.workers.dev" target="_blank">https://x-talent-design-hub-preview.x-talent.workers.dev</a> 供 Jack 與 PM 檢查是否有舊畫面衝突。</li>
            <li><strong>Step 2（正式上線）</strong>：確認無誤後執行 <code>node scripts/publish-design-hub.mjs --mode prod --ticket 737</code>，推至 <code>main</code> 自動更新正式站 <a href="https://x-talent-design-hub.x-talent.workers.dev" target="_blank">https://x-talent-design-hub.x-talent.workers.dev</a>。</li>
          </ul>
          <h3>2. 三方單向同步原則（不互蓋設計稿）</h3>
          <ul style="line-height:1.8;color:#3f3f46">
            <li><strong>Storybook 元件庫</strong>：由 <code>X-Talent-Frontend</code> (<code>develop</code> 分支) 每次更新元件時自動建置發佈至 <code>x-talent-storybook.x-talent.workers.dev</code>，Design Hub 直接即時讀取最新元件，不再使用過期 HTML 腦補。</li>
            <li><strong>Design Hub 頁面</strong>：由 Bonny 維護最新定案的頁面級原型，作為 PM 產寫 PRD 的共同視覺參照。</li>
            <li><strong>Figma Source of Truth (#826)</strong>：保留關鍵畫面（Happy Flow / Error States）與 Design Tokens。</li>
          </ul>
        </div>
      `;
    }

    init();
  </script>
</body>
</html>
